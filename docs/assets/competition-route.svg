<text x="430" y="90">世界坐标：X 向右、Y 向上；长度单位为米。</text>
<text x="430" y="119">地图等比例系数：1；中心路线：30.60 m</text>
<text x="430" y="148">① 绿粗线：入场后沿左通道直达最远端 L7。</text>
<text x="430" y="177">② 蓝实线：从 G7 开始，向下蛇形返回至 G1。</text>
<text x="430" y="206">③ 橙虚线箭头：沿 G1 回左侧，再出门停车。</text>
<text x="430" y="235">包络朝向 90°；默认 90° 方案车头为 +Y。</text>
<text x="430" y="264">先行经过沟口不计覆盖；G7 无北侧作业垄。</text>
<text x="430" y="293">默认前向机构：G6 → G1 处理北侧 R6 → R1。</text>
<text x="430" y="322">R4 为短垄，名义 x = 0.6 .. 2.4 m。</text>
<text x="430" y="351">图线表示车体中心；检查使用整车连续扫掠。</text>
<text x="430" y="380">演示车体 0.27 × 0.27 m：尚未确认</text>
<text x="430" y="409">航向误差 ±5°；跟踪误差 0.02 m</text>
<text x="430" y="438">每侧安全余量：0.01 m</text>
<text x="430" y="467">尚未建模树枝、树体及作业机构的运动包络。</text>
<text x="430" y="496">本图未声称任何真实树位置。</text>
<text x="430" y="525">等比例缩放不能覆盖全部现场尺寸误差。</text>
<text x="430" y="554">其他朝向只验包络，不证明机构作业方向。</text>
<text x="30" y="735" fill="#a12828">仅供离线核查 | deployment_ready = false | 未连接 STM32 或执行机构</text>
